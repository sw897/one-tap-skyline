name: Publish simulated demo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'LICENSE'
      - '.github/workflows/pages.yml'
      - 'pages-web/**'
      - 'tools/build-pages.mjs'
      - 'tsconfig.pages.json'
      - 'src/**'
      - 'public/**'
      - 'build/release-id.mjs'
      - 'docs/images/city-full-simulated.png'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-simulation
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci --ignore-scripts
      - name: Check game and demo rules
        run: npm test
      - name: Build public simulation only
        env:
          DEMO_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DEMO_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build:pages -- --base-path "$DEMO_BASE_PATH" --site-url "$DEMO_SITE_URL"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages-dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
